<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gym Life 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='40' width='84' height='20' rx='4' fill='%23222'/><rect x='14' y='22' width='14' height='56' rx='3' fill='%23f2b705'/><rect x='72' y='22' width='14' height='56' rx='3' fill='%23f2b705'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="card stats">
    <div class="row top"><span id="h-day">Day 1</span><span id="h-money">$0</span></div>
    <div class="bar"><label>Energy</label><div><i id="b-stamina"></i></div><b id="v-stamina"></b></div>
    <div class="bar"><label>Mood</label><div><i id="b-happiness"></i></div><b id="v-happiness"></b></div>
    <div class="sep"></div>
    <div class="bar m"><label>Legs</label><div><i id="b-legs"></i></div><b id="v-legs"></b></div>
    <div class="bar m"><label>Chest</label><div><i id="b-chest"></i></div><b id="v-chest"></b></div>
    <div class="bar m"><label>Back</label><div><i id="b-back"></i></div><b id="v-back"></b></div>
  </div>
  <div id="inventory" class="card"></div>
  <div class="topright">
    <button id="btn-mute" title="Music on/off (M)"></button>
    <button id="btn-quality" title="Graphics quality (G)"></button>
    <button id="btn-help" title="Controls (H)"></button>
  </div>
</div>

<div id="prompt" class="hidden"></div>
<div id="toasts"></div>
<div id="panel" class="hidden"></div>
<div id="fade"></div>

<!-- Touch controls -->
<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button id="btn-action">E</button>
</div>

<noscript><p style="padding:2em">Enable JavaScript to play.</p></noscript>
<script src="game.js"></script>
</body>
</html>

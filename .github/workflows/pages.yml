# Pubblica Gym Life 3D (cartella web3d/) come sito statico su GitHub Pages.
name: Deploy Gym Life 3D su GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web3d/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3d
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web3d/package-lock.json

      - name: Installa dipendenze
        run: npm ci

      - name: Compila il gioco
        run: npm run build

      - name: Prepara il sito
        run: |
          mkdir -p ../_site
          cp index.html style.css game.js ../_site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
